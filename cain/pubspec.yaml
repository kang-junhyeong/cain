name: cain
description: AI 다국어 캠퍼스 생활 안내 앱 — 한국기술교육대학교

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  http: ^1.2.0
  google_maps_flutter: ^2.19.0
  geolocator: ^14.1.2

  # TODO(지도 보류): 지도 구현 방식 결정 후 추가
  # google_maps_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/manifest.json
    - assets/data/services.json
    - assets/data/contacts.json
    - assets/data/buildings.json

  # TODO(지도 보류): 층별 배치도 이미지 확보 후 추가
  # - assets/maps/
